[project]
name = "folderscribe"
version = "0.1.0"
description = "Supervised, physical file organizer for Ubuntu 24.04"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4,<6",
    "python-docx>=1.1,<2",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3,<1",
]

[project.scripts]
folderscribe = "folderscribe.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "ruff>=0.4",
    "mypy>=1.10",
]
gui = [
    "PySide6>=6.7,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
